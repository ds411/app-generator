# yaml-language-server: $schema=../../schema/app.schema.json
# The second example: meeting rooms, their amenities, the members of a
# team, and the bookings of the rooms. It uses the CRUD shorthand with
# the default views and forms, and a few explicit views of its own.
version: 0

app:
  name: room-booking
  title: Room Booking
  description: Book meeting rooms for the members of a team.

entities:
  Room:
    description: A meeting room that members can book.
    # The API serves the rooms under /meeting-rooms, not under /rooms.
    x-fastapi-path: /meeting-rooms
    crud:
      views: [table, detail]
      forms: [create, update]
    display_field: name
    fields:
      name: { type: string, required: true, unique: true, max_length: 80 }
      floor: { type: integer, required: true, min: -2, max: 40 }
      capacity: { type: integer, required: true, min: 1, max: 500 }
      hourly_rate: { type: decimal, min: 0, precision: 8, scale: 2, format: currency, currency: EUR }
      bookable: { type: boolean, default: true }
    relations:
      amenities:
        kind: many_to_many
        target: Amenity
        inverse: rooms
        x-fastapi-table: room_amenity
      bookings: { kind: one_to_many, target: Booking, inverse: room }
    rules:
      unique_name_per_floor:
        kind: unique
        fields: [floor, name]
        message: A room on this floor has the same name.

  Amenity:
    description: Equipment of a room, for example a projector.
    crud:
      views: [table]
      forms: [create]
    display_field: name
    fields:
      name: { type: string, required: true, unique: true, max_length: 60 }
    relations:
      rooms: { kind: many_to_many, target: Room, inverse: amenities }

  Member:
    description: A member of the team.
    crud:
      views: [table, detail]
      forms: [create, update]
    display_field: name
    fields:
      name: { type: string, required: true, max_length: 120 }
      email: { type: email, required: true, unique: true }
      team: { type: enum, values: [design, engineering, sales, support] }
      # The role of the member in the app (see `access`).
      role: { type: enum, values: [admin, member], default: member }
    relations:
      bookings: { kind: one_to_many, target: Booking, inverse: organizer }

  Booking:
    description: A booking of a room for a time range.
    crud:
      views: [detail]
      forms: [update]
    display_field: title
    fields:
      title: { type: string, required: true, max_length: 120 }
      starts_at: { type: datetime, required: true }
      ends_at: { type: datetime, required: true }
      attendees: { type: integer, min: 1, max: 500 }
      # The apps compute the cost from the hours and the rate of the room.
      cost:
        type: decimal
        scale: 2
        format: currency
        currency: EUR
        computed: hours(starts_at, ends_at) * room.hourly_rate
      status:
        type: enum
        values: [requested, confirmed, cancelled]
        default: requested
    relations:
      room:
        kind: many_to_one
        target: Room
        required: true
        on_delete: restrict
        inverse: bookings
      organizer:
        kind: many_to_one
        target: Member
        required: true
        on_delete: restrict
        inverse: bookings
        # The column name of the database. The API field stays `organizer_id`.
        x-fastapi-column: organizer_member_id
    rules:
      ends_after_start:
        kind: compare
        field: ends_at
        op: gt
        other: starts_at
        message: The end must be after the start.
      no_double_booking:
        kind: no_overlap
        start: starts_at
        end: ends_at
        scope: [room]
        message: The room has another booking at this time.
    # The apps run these custom operations after a change of a booking,
    # in the transaction of the change (ADR 0031).
    events:
      # A new time of a booking goes to the organizer.
      changed: { operation: notify_organizer, fields: [starts_at, ends_at] }
    # The change log keeps who changed the time, the room, and the state.
    history: { fields: [title, starts_at, ends_at, status, room] }

operations:
  cancel_booking:
    kind: custom
    entity: Booking
    description: Cancel a booking, and tell the organizer.
    params:
      reason: { type: text, max_length: 500 }
    returns: Booking
  remind_organizer:
    kind: custom
    entity: Booking
    description: Send the organizer a reminder of the booking.
  notify_organizer:
    kind: custom
    entity: Booking
    description: Tell the organizer that the booking is confirmed, or has a new time.
  expire_request:
    kind: custom
    entity: Booking
    description: Cancel a request that nobody confirmed before its start.

# The jobs run on a schedule, or at the time of a date field. The FastAPI
# app runs them in its worker process.
jobs:
  # One day before each confirmed booking starts, the organizer gets a
  # reminder.
  booking_reminder:
    description: Remind the organizer one day before the booking starts.
    entity: Booking
    at: starts_at
    offset: -24h
    filter: { status: confirmed }
    operation: remind_organizer
  # Each hour, the requests that started without a confirmation expire.
  expire_requests:
    description: Cancel the requests that started without a confirmation.
    schedule: "0 * * * *"
    entity: Booking
    filter: { status: requested, starts_at: { lt: $now } }
    operation: expire_request
  # Each Monday at 07:00 UTC, the admins get a report of the week. The
  # code of the report is hand-written.
  weekly_report:
    description: Send the admins a report of the bookings of the week.
    schedule: "0 7 * * 1"

pages:
  dashboard:
    path: /
    title: Dashboard
    content: { dashboard: overview }
  rooms:
    path: /rooms
    title: Rooms
    entity: Room
    content: { view: room_table }
    actions:
      new_room: { kind: form, form: new_room, label: New room, icon: plus }
  room_detail:
    path: "/rooms/{id}"
    title: Room
    entity: Room
    content: { view: room_detail }
    actions:
      edit: { kind: form, form: edit_room, label: Edit, icon: pencil, variant: outline }
  bookings:
    path: /bookings
    title: Bookings
    entity: Booking
    content: { view: booking_board }
    actions:
      new_booking:
        kind: form
        form: new_booking
        label: New booking
        icon: calendar-plus
        # Only the top bar of this page shows the action.
        placement: topbar
  booking_calendar:
    path: /calendar
    title: Calendar
    entity: Booking
    content: { view: booking_calendar }
  booking_detail:
    path: "/bookings/{id}"
    title: Booking
    entity: Booking
    content: { view: booking_detail }
    arrangement: { regions: [title, actions, content] }
    actions:
      edit: { kind: form, form: edit_booking, label: Edit, icon: pencil, variant: outline }
      cancel: { kind: form, form: cancel_booking, label: Cancel, icon: calendar-x, variant: destructive }
  members:
    path: /members
    title: Members
    entity: Member
    content: { view: member_table }
    actions:
      new_member: { kind: form, form: new_member, label: New member, icon: user-plus }
  member_detail:
    path: "/members/{id}"
    title: Member
    entity: Member
    content: { view: member_detail }
  amenities:
    path: /amenities
    title: Amenities
    entity: Amenity
    content: { view: amenity_table }
    actions:
      new_amenity: { kind: form, form: new_amenity, label: New amenity, icon: plus }

ui:
  theme:
    default_mode: system
    mode_toggle: true

  tokens:
    color:
      primary: { $value: "#0f766e", $modes: { dark: "#2dd4bf" } }
      status:
        requested: { $value: "#d97706" }
        confirmed: { $value: "#16a34a" }
        cancelled: { $value: "#64748b" }
    spacing:
      4: { $value: 1rem }
      6: { $value: 1.5rem }
    size:
      sidebar: { $value: 15rem }
    breakpoint:
      sm: { $value: 640px }
      md: { $value: 768px }
      lg: { $value: 1024px }
    motion: { $value: reduced }

  badges:
    booking_status:
      field: Booking.status
      values:
        requested: { label: Requested, color: "{color.status.requested}", icon: clock }
        confirmed: { label: Confirmed, color: "{color.status.confirmed}", icon: circle-check }
        cancelled: { label: Cancelled, color: "{color.status.cancelled}", icon: circle-x }

  layouts:
    app_shell:
      sidebar:
        navigation: main
        title: Room Booking
        icon: door-open
        width: "{size.sidebar}"
      topbar:
        breadcrumbs: true
        mode_toggle: true
      content: { padding: "{spacing.6}" }
      responsive:
        md:
          sidebar: { mode: drawer }
          content: { padding: "{spacing.4}" }

  navigation:
    main:
      items:
        dashboard: { page: dashboard, icon: layout-dashboard }
        bookings: { page: bookings, icon: calendar-days }
        calendar: { page: booking_calendar, icon: calendar-range }
        rooms: { page: rooms, icon: door-open }
        members: { page: members, icon: users }
        amenities: { page: amenities, icon: projector }

  views:
    booking_calendar:
      kind: calendar
      entity: Booking
      title: Booking calendar
      start: starts_at
      end: ends_at
      mode: week
      link: booking_detail
    booking_board:
      kind: board
      entity: Booking
      title: Bookings
      group_by: status
      move: update_booking
      responsive: { below: md, layout: stack }
      card:
        title: title
        subtitle: room
        fields: [starts_at, organizer]
      sort: { field: starts_at }
      row_actions:
        open: { kind: navigate, page: booking_detail, label: Open }
    upcoming_bookings:
      kind: table
      entity: Booking
      columns:
        title: { link: booking_detail }
        room: {}
        starts_at: { format: datetime }
        status: { badge: booking_status }
      sort: { field: starts_at }

  forms:
    new_booking:
      entity: Booking
      operation: create_booking
      title: New booking
      fields:
        title: { placeholder: Weekly planning }
        room: {}
        organizer: {}
        starts_at: {}
        ends_at: {}
        attendees: {}
      rules:
        ends_after_start:
          kind: compare
          field: ends_at
          op: gt
          other: starts_at
          message: The booking must end after it starts.

    cancel_booking:
      entity: Booking
      operation: cancel_booking
      title: Cancel the booking
      submit_label: Cancel booking
      fields:
        reason: { widget: textarea, rows: 3, placeholder: The room is not free. }

  dashboards:
    overview:
      title: Overview
      widgets:
        # The job stat_snapshots stores the value of each day (ADR 0042).
        rooms:
          kind: stat
          label: Bookable rooms
          entity: Room
          filter: { bookable: true }
          icon: door-open
          link: rooms
          snapshots: daily
        requested:
          kind: stat
          label: Requested bookings
          entity: Booking
          filter: { status: requested }
          icon: clock
          link: bookings
        by_status:
          kind: chart
          label: Bookings by status
          chart: donut
          entity: Booking
          group_by: status
          badge: booking_status
          span: 2
        rooms_per_day:
          kind: chart
          label: Bookable rooms per day
          chart: line
          snapshots: rooms
          days: 30
          span: 2
        upcoming:
          kind: list
          label: Upcoming bookings
          view: upcoming_bookings
          filter: { starts_at: { gte: $now }, status: { ne: cancelled } }
          sort: { field: starts_at }
          limit: 5
          link: bookings
          span: 4

  defaults:
    layout: app_shell
    page_size: 20

# A booking starts as a request. An admin confirms or cancels it. A
# cancelled booking stays cancelled.
workflows:
  booking_status:
    entity: Booking
    field: status
    initial: requested
    message: This change of the booking status is not allowed.
    transitions:
      # The confirmation goes to the organizer, in the transaction of the change.
      confirm: { from: [requested], to: confirmed, label: Confirm, run: notify_organizer }
      cancel: { from: [requested, confirmed], to: cancelled, label: Cancel }

# The members sign in with their email address and a password. Anyone
# can see the list of rooms. A new member signs up with a name, an
# email address, and a team, gets the role `member`, and confirms the
# email address with a link before the first sign-in. A member who
# forgets the password gets a reset link that is valid for 30 minutes.
auth:
  user_entity: Member
  username_field: email
  public_pages: [rooms]
  public_operations: [list_rooms]
  session_hours: 12
  min_password_length: 10
  sign_up:
    fields: [name, email, team]
    default_role: member
    verify_email: true
  password_reset:
    token_minutes: 30
  # The app sends the reset links and the verification links as emails
  # with an SMTP server (SMTP_HOST).
  delivery: smtp
  # The members can also sign in with the account of the company. A first
  # sign-in makes a new member.
  providers:
    company:
      title: Company account
      issuer: https://login.example.com
      client_id_env: COMPANY_CLIENT_ID
      client_secret_env: COMPANY_CLIENT_SECRET
      create_users: true
      default_role: member
      claims:
        name: name
  # Each member can turn on a second factor: the codes of an authenticator
  # app on the phone.
  second_factor:
    totp: true

# An admin may do all. A member may read the rooms, the amenities, and
# the bookings, and book rooms, but may not change the rooms, the
# amenities, or the members, and does not see the pages of the members.
# A member sees and changes only the bookings that the member organizes.
access:
  role_field: role
  roles:
    admin:
      label: Admin
      operations: ["*"]
      pages: ["*"]
    member:
      label: Member
      operations:
        - read_room
        - list_amenities
        - read_amenity
        - list_members
        - read_member
        - list_bookings
        - read_booking
        - create_booking
        - update_booking
        - cancel_booking
      pages: [dashboard, room_detail, bookings, booking_calendar, booking_detail, amenities]
      records:
        Booking: { owner: organizer }

notifications:
  booking_moved:
    entity: Booking
    event: changed
    fields: [starts_at, ends_at, room]
    receivers: [organizer]
    text: The booking {title} in {room} has a new time.
  booking_confirmed:
    entity: Booking
    transition: confirm
    receivers: [organizer]
    text: The booking {title} is confirmed.
  booking_cancelled:
    entity: Booking
    transition: cancel
    receivers: [organizer]
    text: The booking {title} is cancelled.
