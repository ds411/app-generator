# yaml-language-server: $schema=../../schema/app.schema.json
#
# A project tracker: projects, their tasks, and the people who work on
# them. This is the main example of appgen. The ui section describes the
# screens: design tokens, the app shell, views, forms, and a dashboard.
version: 0

app:
  name: project-tracker
  title: Project Tracker
  description: Plan projects, split them into tasks, and assign the tasks to people.
  x-fastapi-search: fulltext

entities:
  Person:
    crud: true
    description: A member of the team.
    label: Person
    plural_label: People
    display_field: name
    fields:
      name: { type: string, required: true, max_length: 120 }
      email: { type: email, required: true, unique: true, max_length: 254 }
      role:
        type: enum
        values: [member, lead, admin]
        default: member
      active: { type: boolean, required: true, default: true }
    relations:
      owned_projects: { kind: one_to_many, target: Project, inverse: owner }
      assigned_tasks: { kind: one_to_many, target: Task, inverse: assignee }

  Project:
    crud: true
    description: A body of work with a goal and a due date.
    display_field: name
    fields:
      name: { type: string, required: true, max_length: 120 }
      key:
        type: string
        description: A short code for the project. Task numbers start with it.
        required: true
        unique: true
        pattern: "^[A-Z]{2,6}$"
      description: { type: text, max_length: 5000 }
      status:
        type: enum
        values: [planned, active, on_hold, done]
        default: planned
      start_date: { type: date }
      due_date: { type: date }
      budget: { type: decimal, min: 0, precision: 12, scale: 2, format: currency }
    relations:
      owner:
        kind: many_to_one
        target: Person
        required: true
        on_delete: restrict
        inverse: owned_projects
      tasks: { kind: one_to_many, target: Task, inverse: project }
      members: { kind: many_to_many, target: Person }

  Task:
    crud: true
    description: A piece of work in a project.
    display_field: title
    fields:
      title: { type: string, required: true, max_length: 200, translatable: true }
      description: { type: text, translatable: true }
      status:
        type: enum
        values: [todo, in_progress, in_review, done]
        default: todo
      priority:
        type: enum
        values: [low, medium, high, urgent]
        default: medium
      estimate_hours: { type: decimal, min: 0, max: 1000, precision: 6, scale: 1 }
      due_date: { type: date }
      completed_at: { type: datetime }
    relations:
      project:
        kind: many_to_one
        target: Project
        required: true
        on_delete: cascade
        inverse: tasks
      assignee:
        kind: many_to_one
        target: Person
        on_delete: set_null
        inverse: assigned_tasks
      comments: { kind: one_to_many, target: Comment, inverse: task }
    events:
      # A new status sets the time of the completion, or clears it.
      changed: { operation: record_completion, fields: [status] }

  Comment:
    crud: [create, list, delete]
    description: A note on a task.
    fields:
      body: { type: text, required: true, max_length: 10000 }
      posted_at: { type: datetime, required: true }
    relations:
      task:
        kind: many_to_one
        target: Task
        required: true
        on_delete: cascade
        inverse: comments
      author: { kind: many_to_one, target: Person, required: true, on_delete: restrict }

operations:
  archive_project:
    kind: custom
    entity: Project
    description: Set the project to done and close all its open tasks.
    returns: Project

  assign_task:
    kind: custom
    entity: Task
    description: Assign a task to a person, and tell the person.
    params:
      assignee_id: { type: uuid, required: true }
      note: { type: text, max_length: 500 }
    returns: Task
  complete_task:
    kind: custom
    entity: Task
    description: Set the task to done and record the time.
    returns: Task
  record_completion:
    kind: custom
    entity: Task
    description: Set the completion time of a task that is done, and clear it for other tasks.
  schedule_task:
    kind: custom
    entity: Task
    description: >-
      Set the due date of the task to a number of working days from today.
      Weekends and the public holidays of the country are not working days.
    params:
      working_days: { type: integer, required: true, min: 1, max: 250 }
      country_code: { type: string, required: true, pattern: "^[A-Z]{2}$", default: DE }
    returns: Task
    # The extension file of the operation gets the client of the API.
    apis: [holidays]

# Third-party APIs (ADR 0019). Each app gets a typed client for the
# operations in the list. The OpenAPI documents are local files.
apis:
  holidays:
    description: The public holidays of the countries.
    document: apis/public-holidays.openapi.yaml
    base_url_env: HOLIDAYS_API_URL
    operations: [getPublicHolidays, getNextPublicHolidays]
  exchange_rates:
    description: The exchange rates of the currencies, for the budgets.
    document: apis/exchange-rates.openapi.json
    base_url_env: EXCHANGE_RATES_API_URL
    security: { scheme: ApiKeyAuth, env: EXCHANGE_RATES_API_KEY }
    # The FastAPI app calls the API for the React app, which cannot keep the key.
    expose: true
    operations:
      getLatestRates: {}
      convertAmount:
        description: Convert a budget to another currency.
  documents:
    description: The attachments, the exports, and the reports of the projects.
    # A multipart form, a form, a text answer, and a binary answer.
    document: apis/documents.openapi.yaml
    base_url_env: DOCUMENTS_API_URL
    operations: [uploadAttachment, sendFeedback, exportTasks, downloadReport]
  finance:
    description: The budgets of the projects.
    document: apis/finance.openapi.yaml
    base_url_env: FINANCE_API_URL
    # OAuth 2.0 with the client credentials flow: the server clients get the tokens.
    security:
      scheme: oauth
      client_id_env: FINANCE_CLIENT_ID
      client_secret_env: FINANCE_CLIENT_SECRET
      scopes: [budgets:read]
    # A browser cannot keep the secret or set the cookie of the API.
    expose: true
    operations: [getBudget]

# Webhooks (ADR 0028): the requests that other systems send to the app.
# The server apps check the signature, and run the logic one time for
# each event ID.
webhooks:
  commits:
    description: >-
      The code host reports a commit that refers to a task. The app adds
      the commit message to the task as a comment of the author.
    path: /webhooks/commits
    signature:
      scheme: hmac_sha256
      header: X-Signature-256
      prefix: "sha256="
      secret_env: COMMITS_WEBHOOK_SECRET
    body: { document: webhooks/commits.openapi.yaml, schema: CommitEvent }

pages:
  dashboard:
    path: /
    title: Dashboard
    content: { dashboard: overview }
  projects:
    path: /projects
    title: Projects
    entity: Project
    content: { view: project_table }
  project_detail:
    path: "/projects/{id}"
    title: Project
    entity: Project
    content: { view: project_detail }
    arrangement: { regions: [title, actions, content], columns: 2 }
    actions:
      # The page header shows the action, and the top bar hides its own.
      new_task: { kind: form, form: new_task, label: New task, icon: plus, placement: page }
  task_board:
    path: /tasks
    title: Tasks
    entity: Task
    content: { view: task_board }
  task_detail:
    path: "/tasks/{id}"
    title: Task
    entity: Task
    content: { view: task_detail }
    actions:
      delete:
        kind: operation
        operation: delete_task
        label: Delete
        icon: trash-2
        variant: destructive
        confirm: { title: "Delete the task?", message: This also deletes its comments., confirm_label: Delete }
        on_success: { toast: The task is deleted., navigate: task_board }
  people:
    path: /people
    title: People
    entity: Person
    content: { view: person_cards }
  # The pages of API data (ADR 0022): each view shows the answer of an
  # operation of a third-party API.
  holidays:
    path: /holidays
    title: Public holidays
    content: { view: public_holidays }
  upcoming_holidays:
    path: /holidays/upcoming
    title: Upcoming holidays
    content: { view: upcoming_holidays }
  exchange_rates:
    path: /exchange-rates
    title: Exchange rates
    content: { view: latest_rates }
  budget:
    path: /budget
    title: Budget
    content: { view: project_budget }
  # Other websites can show this page in a frame (ADR 0032), for example
  # the intranet of a customer. The page shows without the app shell.
  holiday_widget:
    path: /embed/holidays
    title: Public holidays
    content: { view: public_holidays }
    embed: [https://partner.example]

ui:
  theme:
    default_mode: system
    mode_toggle: true

  # Design tokens (ADR 0003). Base tokens hold the palette and the scales.
  # Semantic tokens refer to them, with a value for each color mode. The
  # semantic color names are the names of the shadcn/ui theme variables.
  tokens:
    color:
      $description: The palette and the semantic colors of the theme.
      white: { $value: "#ffffff" }
      black: { $value: "#000000" }
      slate:
        50: { $value: "oklch(0.984 0.003 247.858)" }
        100: { $value: "oklch(0.968 0.007 247.896)" }
        200: { $value: "oklch(0.929 0.013 255.508)" }
        300: { $value: "oklch(0.869 0.022 252.894)" }
        400: { $value: "oklch(0.704 0.04 256.788)" }
        500: { $value: "oklch(0.554 0.046 257.417)" }
        600: { $value: "oklch(0.446 0.043 257.281)" }
        700: { $value: "oklch(0.372 0.044 257.287)" }
        800: { $value: "oklch(0.279 0.041 260.031)" }
        900: { $value: "oklch(0.208 0.042 265.755)" }
        950: { $value: "oklch(0.129 0.042 264.695)" }
      indigo:
        400: { $value: "oklch(0.673 0.182 276.935)" }
        500: { $value: "oklch(0.585 0.233 277.117)" }
        600: { $value: "oklch(0.511 0.262 276.966)" }
      sky:
        500: { $value: "oklch(0.685 0.169 237.323)" }
      emerald:
        500: { $value: "oklch(0.696 0.17 162.48)" }
        600: { $value: "oklch(0.596 0.145 163.225)" }
      amber:
        500: { $value: "oklch(0.769 0.188 70.08)" }
      orange:
        500: { $value: "oklch(0.705 0.213 47.604)" }
      red:
        500: { $value: "oklch(0.637 0.237 25.331)" }
        600: { $value: "oklch(0.577 0.245 27.325)" }
      violet:
        500: { $value: "oklch(0.606 0.25 292.717)" }

      background:
        $value: "{color.white}"
        $modes: { dark: "{color.slate.950}" }
      foreground:
        $value: "{color.slate.950}"
        $modes: { dark: "{color.slate.50}" }
      card:
        $value: "{color.white}"
        $modes: { dark: "{color.slate.900}" }
      card_foreground:
        $value: "{color.slate.950}"
        $modes: { dark: "{color.slate.50}" }
      popover:
        $value: "{color.white}"
        $modes: { dark: "{color.slate.900}" }
      popover_foreground:
        $value: "{color.slate.950}"
        $modes: { dark: "{color.slate.50}" }
      primary:
        $value: "{color.indigo.600}"
        $modes: { dark: "{color.indigo.400}" }
      primary_foreground:
        $value: "{color.white}"
        $modes: { dark: "{color.slate.950}" }
      secondary:
        $value: "{color.slate.100}"
        $modes: { dark: "{color.slate.800}" }
      secondary_foreground:
        $value: "{color.slate.900}"
        $modes: { dark: "{color.slate.50}" }
      muted:
        $value: "{color.slate.100}"
        $modes: { dark: "{color.slate.800}" }
      muted_foreground:
        $value: "{color.slate.500}"
        $modes: { dark: "{color.slate.400}" }
      accent:
        $value: "{color.slate.100}"
        $modes: { dark: "{color.slate.800}" }
      accent_foreground:
        $value: "{color.slate.900}"
        $modes: { dark: "{color.slate.50}" }
      destructive:
        $value: "{color.red.600}"
        $modes: { dark: "{color.red.500}" }
      border:
        $value: "{color.slate.200}"
        $modes: { dark: "{color.slate.800}" }
      input:
        $value: "{color.slate.200}"
        $modes: { dark: "{color.slate.800}" }
      ring:
        $value: "{color.indigo.500}"
        $modes: { dark: "{color.indigo.400}" }
      chart_1: { $value: "{color.indigo.500}" }
      chart_2: { $value: "{color.sky.500}" }
      chart_3: { $value: "{color.emerald.500}" }
      chart_4: { $value: "{color.amber.500}" }
      chart_5: { $value: "{color.violet.500}" }
      sidebar:
        $value: "{color.slate.50}"
        $modes: { dark: "{color.slate.900}" }
      sidebar_foreground:
        $value: "{color.slate.700}"
        $modes: { dark: "{color.slate.200}" }
      sidebar_primary:
        $value: "{color.indigo.600}"
        $modes: { dark: "{color.indigo.400}" }
      sidebar_accent:
        $value: "{color.slate.200}"
        $modes: { dark: "{color.slate.800}" }
      sidebar_border:
        $value: "{color.slate.200}"
        $modes: { dark: "{color.slate.800}" }
      status:
        $description: The colors of the status and priority badges.
        neutral: { $value: "{color.slate.500}" }
        info: { $value: "{color.sky.500}" }
        progress: { $value: "{color.indigo.500}" }
        review: { $value: "{color.violet.500}" }
        success: { $value: "{color.emerald.600}" }
        warning: { $value: "{color.amber.500}" }
        alert: { $value: "{color.orange.500}" }
        danger: { $value: "{color.red.600}" }

    font_family:
      sans: { $value: [Inter, ui-sans-serif, system-ui, sans-serif] }
      mono: { $value: [JetBrains Mono, ui-monospace, monospace] }
    font_size:
      xs: { $value: 0.75rem }
      sm: { $value: 0.875rem }
      base: { $value: 1rem }
      lg: { $value: 1.125rem }
      xl: { $value: 1.25rem }
      2xl: { $value: 1.5rem }
      3xl: { $value: 1.875rem }
    font_weight:
      regular: { $value: 400 }
      medium: { $value: 500 }
      semibold: { $value: 600 }
      bold: { $value: 700 }
    line_height:
      tight: { $value: 1.25 }
      snug: { $value: 1.375 }
      normal: { $value: 1.5 }
    letter_spacing:
      tight: { $value: -0.025em }
      normal: { $value: 0em }
      wide: { $value: 0.05em }
    typography:
      body:
        $value:
          font_family: "{font_family.sans}"
          font_size: "{font_size.sm}"
          font_weight: "{font_weight.regular}"
          line_height: "{line_height.normal}"
      label:
        $value:
          font_family: "{font_family.sans}"
          font_size: "{font_size.xs}"
          font_weight: "{font_weight.medium}"
          line_height: "{line_height.normal}"
          letter_spacing: "{letter_spacing.wide}"
      heading:
        $value:
          font_family: "{font_family.sans}"
          font_size: "{font_size.2xl}"
          font_weight: "{font_weight.semibold}"
          line_height: "{line_height.tight}"
          letter_spacing: "{letter_spacing.tight}"
      stat:
        $value:
          font_family: "{font_family.sans}"
          font_size: "{font_size.3xl}"
          font_weight: "{font_weight.bold}"
          line_height: "{line_height.tight}"
      code:
        $value:
          font_family: "{font_family.mono}"
          font_size: "{font_size.xs}"
          font_weight: "{font_weight.regular}"
          line_height: "{line_height.normal}"
    spacing:
      0: { $value: 0 }
      1: { $value: 0.25rem }
      2: { $value: 0.5rem }
      3: { $value: 0.75rem }
      4: { $value: 1rem }
      6: { $value: 1.5rem }
      8: { $value: 2rem }
      12: { $value: 3rem }
    size:
      sidebar: { $value: 16rem }
      sidebar_icons: { $value: 3rem }
      content: { $value: 80rem }
      column_sm: { $value: 6rem }
      column_md: { $value: 10rem }
      column_lg: { $value: 18rem }
    radius:
      sm: { $value: 0.375rem }
      md: { $value: 0.5rem }
      lg: { $value: 0.625rem }
      xl: { $value: 0.875rem }
    shadow:
      sm:
        $value: { color: "#0000000d", offset_x: 0, offset_y: 1px, blur: 2px, spread: 0 }
      md:
        $value:
          - { color: "#0000001a", offset_x: 0, offset_y: 4px, blur: 6px, spread: -1px }
          - { color: "#0000001a", offset_x: 0, offset_y: 2px, blur: 4px, spread: -2px }
        $modes:
          dark: { color: "#00000066", offset_x: 0, offset_y: 4px, blur: 8px, spread: 0 }
    breakpoint:
      sm: { $value: 640px }
      md: { $value: 768px }
      lg: { $value: 1024px }
      xl: { $value: 1280px }
    duration:
      fast: { $value: 150ms }
      normal: { $value: 250ms }
    motion: { $value: reduced }

  badges:
    project_status:
      field: Project.status
      values:
        planned: { label: Planned, color: "{color.status.neutral}", icon: circle-dashed }
        active: { label: Active, color: "{color.status.progress}", icon: circle-play }
        on_hold: { label: On hold, color: "{color.status.warning}", icon: circle-pause }
        done: { label: Done, color: "{color.status.success}", icon: circle-check }
    task_status:
      field: Task.status
      values:
        todo: { label: To do, color: "{color.status.neutral}", icon: circle }
        in_progress: { label: In progress, color: "{color.status.progress}", icon: loader }
        in_review: { label: In review, color: "{color.status.review}", icon: eye }
        done: { label: Done, color: "{color.status.success}", icon: circle-check }
    task_priority:
      field: Task.priority
      values:
        low: { label: Low, color: "{color.status.neutral}", icon: arrow-down }
        medium: { label: Medium, color: "{color.status.info}", icon: arrow-right }
        high: { label: High, color: "{color.status.alert}", icon: arrow-up }
        urgent: { label: Urgent, color: "{color.status.danger}", icon: siren }
    person_role:
      field: Person.role
      values:
        member: { label: Member, color: "{color.status.neutral}" }
        lead: { label: Lead, color: "{color.status.info}", icon: star }
        admin: { label: Admin, color: "{color.status.review}", icon: shield }

  layouts:
    app_shell:
      sidebar:
        navigation: main
        title: Project Tracker
        icon: folder-kanban
        width: "{size.sidebar}"
      topbar:
        breadcrumbs: true
        search: true
        mode_toggle: true
        actions:
          new_task: { kind: form, form: new_task, label: New task, icon: plus }
      content: { max_width: "{size.content}", padding: "{spacing.8}" }
      footer: { text: "Project Tracker, generated by appgen." }
      responsive:
        lg:
          sidebar: { mode: icons, width: "{size.sidebar_icons}" }
          content: { padding: "{spacing.6}" }
        md:
          sidebar: { mode: drawer }
          topbar: { search: false }
          content: { padding: "{spacing.4}" }

  navigation:
    main:
      items:
        dashboard: { page: dashboard, label: Dashboard, icon: layout-dashboard }
      groups:
        work:
          label: Work
          items:
            projects: { page: projects, icon: folder-kanban }
            tasks: { page: task_board, label: Task board, icon: square-kanban }
        team:
          label: Team
          collapsible: true
          items:
            people: { page: people, icon: users }

  views:
    project_table:
      kind: table
      entity: Project
      title: Projects
      description: All projects, with their owner, status, and dates.
      columns:
        key: { label: Key, width: "{size.column_sm}" }
        name: { label: Project, link: project_detail, width: "{size.column_lg}" }
        status: { label: Status, badge: project_status }
        owner: { label: Owner, format: avatar }
        start_date: { label: Start, format: date, hide_below: lg }
        due_date: { label: Due, format: date, align: end }
        budget: { label: Budget, align: end, hide_below: md }
      sort: { field: due_date, direction: asc }
      filters:
        search: { kind: search, label: Search projects, fields: [name, key, owner.name] }
        status: { kind: select, label: Status, field: status, multiple: true }
        owner: { kind: select, label: Owner, field: owner }
        due: { kind: date_range, label: Due date, field: due_date }
      pagination: { page_size: 20, page_sizes: [10, 20, 50] }
      row_actions:
        open: { kind: navigate, page: project_detail, label: Open, icon: arrow-right }
        edit: { kind: form, form: edit_project, label: Edit, icon: pencil }
        delete:
          kind: operation
          operation: delete_project
          label: Delete
          icon: trash-2
          variant: destructive
          confirm:
            title: Delete the project?
            message: This deletes the project and all its tasks.
            confirm_label: Delete
          on_success: { toast: The project is deleted. }
      row_click: open
      selection: true
      bulk_actions:
        archive: { kind: operation, operation: archive_project, label: Archive, icon: archive }
      states:
        empty:
          title: No projects yet
          text: Create a project to plan your work.
          icon: folder-plus
          action: new_project
      actions:
        new_project: { kind: form, form: new_project, label: New project, icon: plus }

    task_board:
      kind: board
      entity: Task
      title: Task board
      group_by: status
      columns:
        todo: { label: To do, color: "{color.status.neutral}" }
        in_progress: { label: In progress, color: "{color.status.progress}", limit: 8 }
        in_review: { label: In review, color: "{color.status.review}", limit: 5 }
        done: { label: Done, color: "{color.status.success}" }
      responsive: { below: md, layout: stack }
      card:
        title: title
        subtitle: project
        badge: { field: priority, badge: task_priority }
        fields: [due_date, estimate_hours]
        footer: [assignee]
      sort: { field: due_date }
      move: update_task
      row_actions:
        open: { kind: navigate, page: task_detail, label: Open }
        edit: { kind: form, form: edit_task, label: Edit, icon: pencil }
      actions:
        new_task: { kind: form, form: new_task, label: New task, icon: plus }
      states:
        loading: { indicator: skeleton, text: Loading the board }

    task_table:
      kind: table
      entity: Task
      columns:
        title: { label: Task, link: task_detail, width: "{size.column_lg}" }
        status: { badge: task_status }
        priority: { badge: task_priority, hide_below: md }
        assignee: { format: avatar }
        due_date: { format: date, align: end }
      sort: { field: due_date }
      filters:
        status: { kind: select, field: status, multiple: true }
        assignee: { kind: select, field: assignee }
      pagination: { page_size: 10 }
      row_click: open
      row_actions:
        open: { kind: navigate, page: task_detail }
        complete:
          kind: operation
          operation: complete_task
          label: Complete
          icon: circle-check
          on_success: { toast: The task is done. }

    task_detail:
      kind: detail
      entity: Task
      header: { title: title, subtitle: project, badges: [status, priority] }
      sections:
        summary:
          title: Summary
          fields: [assignee, due_date, estimate_hours, completed_at]
          columns: 4
      tabs:
        details:
          label: Details
          icon: file-text
          sections:
            description: { title: Description, fields: [description] }
            project: { title: Project, fields: [project, project.owner, project.due_date], columns: 3 }
        comments: { label: Comments, icon: message-square, relation: comments, view: comment_table }
        activity: { label: Activity, icon: history, custom: true }
      actions:
        edit: { kind: form, form: edit_task, label: Edit, icon: pencil }
        assign: { kind: form, form: assign_task, label: Assign, icon: user-plus, variant: outline }
        complete:
          kind: operation
          operation: complete_task
          label: Complete
          icon: circle-check
          variant: secondary
          on_success: { toast: The task is done. }

    project_detail:
      kind: detail
      entity: Project
      header: { title: name, subtitle: key, badges: [status] }
      sections:
        overview:
          title: Overview
          fields: [owner, start_date, due_date, budget]
          columns: 4
      tabs:
        about:
          label: About
          icon: info
          sections:
            description: { title: Description, fields: [description] }
        tasks: { label: Tasks, icon: list-checks, relation: tasks, view: task_table }
        members: { label: Members, icon: users, relation: members, view: person_cards }
        timeline: { label: Timeline, icon: chart-gantt, custom: true }
      actions:
        edit: { kind: form, form: edit_project, label: Edit, icon: pencil }
        archive:
          kind: operation
          operation: archive_project
          label: Archive
          icon: archive
          variant: outline
          confirm: { title: "Archive the project?", message: All open tasks close., confirm_label: Archive }

    person_cards:
      kind: cards
      entity: Person
      card:
        title: name
        subtitle: email
        badge: { field: role, badge: person_role }
        fields: [active]
      grid:
        columns: 4
        gap: "{spacing.4}"
        responsive:
          xl: { columns: 3 }
          lg: { columns: 2 }
          sm: { columns: 1 }
      sort: { field: name }
      filters:
        search: { kind: search, label: Search people, fields: [name, email] }
        role: { kind: select, field: role }
        active: { kind: boolean, field: active, label: Active only, default: true }
      row_actions:
        edit: { kind: form, form: edit_person, label: Edit, icon: pencil }
      actions:
        new_person: { kind: form, form: new_person, label: Add person, icon: user-plus }

    comment_table:
      kind: table
      entity: Comment
      columns:
        author: { format: avatar, width: "{size.column_md}" }
        body: { label: Comment }
        posted_at: { label: Posted, format: relative_time, align: end }
      sort: { field: posted_at, direction: desc }
      pagination: { page_size: 10 }
      actions:
        new_comment: { kind: form, form: new_comment, label: Add comment, icon: message-square-plus }
      row_actions:
        delete:
          kind: operation
          operation: delete_comment
          label: Delete
          variant: destructive
          confirm: { title: "Delete the comment?" }
      states:
        empty: { title: No comments yet, icon: message-square, action: new_comment }

    # The views of API data: a view with a source shows the answer of the
    # operation, with the values of its parameters in `params`.
    public_holidays:
      kind: table
      source: apis.holidays.operations.getPublicHolidays
      params: { year: 2026, countryCode: DE }
      columns:
        date: { label: Date, width: "{size.column_md}" }
        name: { label: Holiday }
        local_name: { field: localName, hide_below: md }
        global: { label: Nationwide, align: center }
        types: { sortable: false, hide_below: lg }
      sort: { field: date }
      filters:
        search: { kind: search, label: Search holidays, fields: [name, localName] }

    upcoming_holidays:
      kind: cards
      source: apis.holidays.operations.getNextPublicHolidays
      params: { countryCode: DE }
      card:
        title: name
        subtitle: date
        fields: [localName, global]
        footer: [types]
      pagination: { page_size: 12 }

    latest_rates:
      kind: detail
      # The Next.js app and the FastAPI app keep the key of the API. The
      # React app calls the endpoint of the FastAPI app (`expose`).
      source: apis.exchange_rates.operations.getLatestRates
      params: { base: EUR }
      sections:
        summary: { title: Base currency, fields: [base, date], columns: 2 }

    project_budget:
      kind: detail
      # The server clients send the access token of OAuth 2.0 and the cookie `tenant`.
      source: apis.finance.operations.getBudget
      params: { project: APP, tenant: acme }
      header: { title: project, subtitle: currency }
      sections:
        money: { title: Money, fields: [amount, spent], columns: 2 }

  forms:
    new_project:
      entity: Project
      operation: create_project
      title: New project
      description: Plan a new body of work.
      submit_label: Create project
      grid:
        columns: 2
        gap: "{spacing.4}"
        responsive:
          sm: { columns: 1 }
      sections:
        basics: { title: Basics, fields: [name, key, owner, status] }
        planning: { title: Planning, fields: [start_date, due_date, budget, description] }
      fields:
        name:
          placeholder: Website relaunch
          rules:
            required: { message: Enter a name. }
            min_length: { value: 3, message: Use 3 or more characters. }
        key:
          help: 2 to 6 capital letters. Task numbers start with it.
          placeholder: WEB
          rules:
            pattern: { value: "^[A-Z]{2,6}$", message: Use 2 to 6 capital letters. }
        owner: { widget: relation, label: Owner }
        status: { widget: select }
        start_date: {}
        due_date: {}
        budget: { step: 100, rules: { min: { value: 0, message: The budget cannot be negative. } } }
        description: { widget: textarea, rows: 4, span: 2 }
      rules:
        due_after_start:
          kind: compare
          field: due_date
          op: gte
          other: start_date
          message: The due date must be on or after the start date.
      on_success: { toast: The project is created., navigate: project_detail }

    edit_project:
      entity: Project
      operation: update_project
      mode: sheet
      title: Edit project
      submit_label: Save
      fields:
        name: {}
        status: { widget: radio }
        owner: { widget: relation }
        members: { widget: relation, help: The people who work on the project. }
        start_date: {}
        due_date: {}
        budget: {}
        description: { widget: textarea, rows: 6 }
      rules:
        due_after_start:
          kind: compare
          field: due_date
          op: gte
          other: start_date
          message: The due date must be on or after the start date.
      on_success: { toast: The project is saved. }

    new_task:
      entity: Task
      operation: create_task
      title: New task
      submit_label: Create task
      grid: { columns: 2, gap: "{spacing.4}", responsive: { sm: { columns: 1 } } }
      sections:
        task: { fields: [title, description] }
        planning: { title: Planning, fields: [project, assignee, status, priority, due_date, estimate_hours] }
      fields:
        title:
          span: 2
          placeholder: What needs to be done?
          rules: { required: { message: Enter a title. } }
        description: { widget: textarea, rows: 3, span: 2 }
        project: { widget: relation }
        assignee: { widget: relation, placeholder: Nobody }
        status: {}
        priority: { widget: radio }
        due_date: {}
        estimate_hours: { label: Estimate (hours), step: 0.5 }
      defaults: { project: $route.id, status: todo, priority: medium }
      on_success: { toast: The task is created. }

    edit_task:
      entity: Task
      operation: update_task
      mode: sheet
      title: Edit task
      submit_label: Save
      fields:
        title: {}
        description: { widget: textarea, rows: 6 }
        status: {}
        priority: { widget: radio }
        assignee: { widget: relation }
        due_date: {}
        estimate_hours: { step: 0.5 }
      on_success: { toast: The task is saved. }

    assign_task:
      entity: Task
      operation: assign_task
      title: Assign the task
      submit_label: Assign
      fields:
        assignee_id:
          widget: custom
          label: Person
          help: A person picker. The widget is a generation gap.
        note: { widget: textarea, rows: 3, placeholder: A note for the person }
      rules:
        active_person:
          kind: custom
          fields: [assignee_id]
          message: The person must be active.
      on_success: { toast: The task is assigned. }

    new_person:
      entity: Person
      operation: create_person
      title: Add a person
      grid: { columns: 2, gap: "{spacing.4}" }
      fields:
        name: { span: 2 }
        email: { placeholder: name@example.com }
        role: { widget: select }
        active: { widget: switch }
      on_success: { toast: The person is added. }

    edit_person:
      entity: Person
      operation: update_person
      mode: sheet
      fields:
        name: {}
        email: {}
        role: { widget: radio }
        active: { widget: switch }

    new_comment:
      entity: Comment
      operation: create_comment
      title: Add a comment
      fields:
        body: { widget: textarea, rows: 4, label: Comment, rules: { required: { message: Write a comment. } } }
        task: { widget: relation }
        author: { widget: relation }
      defaults: { task: $route.id }

  dashboards:
    overview:
      title: Overview
      description: The state of the projects and the tasks.
      grid:
        columns: 4
        gap: "{spacing.6}"
        responsive:
          lg: { columns: 2 }
          sm: { columns: 1, gap: "{spacing.4}" }
      widgets:
        active_projects:
          kind: stat
          label: Active projects
          entity: Project
          filter: { status: active }
          icon: folder-kanban
          color: "{color.status.progress}"
          link: projects
        open_tasks:
          kind: stat
          label: Open tasks
          entity: Task
          filter: { status: { ne: done } }
          icon: list-todo
          color: "{color.status.info}"
          link: task_board
        overdue_tasks:
          kind: stat
          label: Overdue tasks
          entity: Task
          filter: { due_date: { lt: $today }, status: { ne: done } }
          icon: alarm-clock
          color: "{color.destructive}"
          link: task_board
        total_budget:
          kind: stat
          label: Budget of active projects
          entity: Project
          aggregate: sum
          field: budget
          filter: { status: { in: [planned, active] } }
          icon: wallet
          color: "{color.status.success}"
        tasks_by_status:
          kind: chart
          label: Tasks by status
          chart: donut
          entity: Task
          group_by: status
          badge: task_status
          span: 2
        hours_by_person:
          kind: chart
          label: Open hours by person
          chart: bar
          entity: Task
          group_by: assignee
          aggregate: sum
          field: estimate_hours
          filter: { status: { not_in: [done] } }
          span: 2
        due_soon:
          kind: list
          label: Due soon
          view: task_table
          filter: { status: { ne: done }, due_date: { gte: $today } }
          sort: { field: due_date }
          limit: 6
          link: task_board
          span: 3
        workload:
          kind: custom
          label: Team workload
          span: 1
        # The hand-written code of the widget calls the holidays API
        # (examples/project-tracker/extensions/).
        holidays:
          kind: custom
          label: Next public holidays
          span: 4

  defaults:
    layout: app_shell
    page_size: 20
    states:
      loading: { indicator: skeleton }
      empty: { title: Nothing here yet, icon: inbox }
      error: { title: Something went wrong, text: Try again in a moment., icon: triangle-alert, action: retry }

