# expect: unsuitable-security
# The clients send an API key, a bearer token, or a user name and a
# password (HTTP Basic), not the answer of HTTP Digest authentication.
version: 0
app: { name: shop, title: Shop }
entities:
  Order:
    fields:
      number: { type: string }
apis:
  status:
    document: apis/digest-auth.openapi.yaml
    base_url_env: STATUS_API_URL
    security: { scheme: digest, env: STATUS_API_PASSWORD }
    operations: [getStatus]
