[project]
name = "project-tracker"
version = "0.1.0"
description = "Project Tracker"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.161,<0.162",
    "pydantic-settings>=2.16",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyright>=1.1.414",
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# The formatter keeps the code lines short. Trace comments can be longer.
ignore = ["E501"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
