# Generated by appgen. Do not edit: change the app definition instead.
# @trace app file
# Start Postgres, run the migrations, and start the API on port 8000 with
# the seed records:
#   docker compose up --build

name: "project-tracker"

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18}
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: project_tracker
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d project_tracker"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: project-tracker-api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/project_tracker
    depends_on:
      db:
        condition: service_healthy

  api:
    image: project-tracker-api
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/project_tracker
      DATABASE_SEED: "true"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
