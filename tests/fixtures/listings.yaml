# yaml-language-server: $schema=../../schema/app.schema.json
# Listings: the holiday homes of M35 and their bookings. The queries
# give the listings of a city for a count of guests, the bookings of a
# listing, and the count of the bookings and the nights of each month of
# a year (ADR 0045). The logic of the queries is hand-written: the checks
# copy the files of tests/fixtures/listings/extensions/<binding> into each
# app before they generate it. A table, a card list, and a calendar show
# the rows of the queries, with filters and path parameters for the
# params. The table of the page /free has the available filters of the
# bookings (date fields) and of the cleanings (date-time fields) of a
# listing (ADR 0047). scripts/check-fastapi.sh generates and checks the
# FastAPI app of this definition, and runs its tests on Postgres and
# SQLite. scripts/listings_ui_test.py runs the UI tests of the views of
# the queries and of the available filter in each front end.
version: 0

app:
  name: listings
  title: Listings
  description: Holiday homes and their bookings.

entities:
  Listing:
    display_field: title
    crud: { views: [table, detail], forms: [create, update] }
    fields:
      title: { type: string, required: true, max_length: 120 }
      city: { type: string, required: true, max_length: 80 }
      guests: { type: integer, required: true, min: 1, max: 20 }
      nightly_rate:
        type: decimal
        required: true
        min: 0
        precision: 8
        scale: 2
        format: currency
        currency: EUR
    relations:
      bookings: { kind: one_to_many, target: Booking, inverse: listing }
      cleanings: { kind: one_to_many, target: Cleaning, inverse: listing }

  Booking:
    display_field: guest
    crud: { views: [table], forms: [create] }
    fields:
      guest: { type: string, required: true, max_length: 120 }
      check_in: { type: date, required: true }
      check_out: { type: date, required: true }
    relations:
      listing:
        kind: many_to_one
        target: Listing
        required: true
        inverse: bookings
        on_delete: cascade
    rules:
      check_out_after_check_in:
        kind: compare
        field: check_out
        op: gt
        other: check_in
        message: The check-out must be after the check-in.
      no_double_booking:
        kind: no_overlap
        start: check_in
        end: check_out
        scope: [listing]
        message: The listing has another booking on these dates.

  Cleaning:
    display_field: team
    crud: { operations: [list, create] }
    fields:
      team: { type: string, required: true, max_length: 80 }
      starts_at: { type: datetime, required: true }
      ends_at: { type: datetime, required: true }
    relations:
      listing:
        kind: many_to_one
        target: Listing
        required: true
        inverse: cleanings
        on_delete: cascade
    rules:
      one_cleaning_at_a_time:
        kind: no_overlap
        start: starts_at
        end: ends_at
        scope: [listing]
        message: The listing has another cleaning at this time.

pages:
  listings: { path: /listings, title: Listings, content: { view: listing_table } }
  free_listings: { path: /free, title: Free listings, content: { view: free_listings } }
  listing_detail:
    path: "/listings/{id}"
    title: Listing
    entity: Listing
    content: { view: listing_detail }
  new_listing: { path: /listings/new, title: New listing, content: { form: new_listing } }
  edit_listing:
    path: "/listings/{id}/edit"
    title: Edit listing
    entity: Listing
    content: { form: edit_listing }
  listing_calendar:
    path: "/listings/{id}/calendar"
    title: Bookings of the listing
    content: { view: listing_calendar }
  stays: { path: /stays, title: Stays, content: { view: stay_table } }
  booking_months:
    path: "/booking-months/{year}"
    title: Bookings by month
    content: { view: month_cards }
  bookings: { path: /bookings, title: Bookings, content: { view: booking_table } }
  new_booking: { path: /bookings/new, title: New booking, content: { form: new_booking } }

operations:
  listings_for_guests:
    kind: query
    entity: Listing
    description: The listings of a city with room for a count of guests, the cheapest first.
    params:
      city: { type: string, required: true, max_length: 80 }
      guests: { type: integer, min: 1, max: 20 }
    returns: Listing
  bookings_of_listing:
    kind: query
    entity: Booking
    description: The bookings of a listing, by check-in.
    params:
      listing: { type: uuid, required: true }
    returns: Booking
  bookings_by_month:
    kind: query
    entity: Booking
    description: The count of the bookings and of their nights in each month of a year.
    params:
      year: { type: integer, required: true, min: 2000, max: 2100 }
    result:
      month: { type: date, required: true, label: Month }
      bookings: { type: integer, required: true, label: Bookings }
      nights: { type: integer, required: true, label: Nights }

ui:
  views:
    free_listings:
      kind: table
      entity: Listing
      title: Free listings
      columns:
        title: { link: listing_detail }
        city: {}
      sort: { field: title }
      filters:
        dates: { kind: available, rule: bookings.no_double_booking, label: Dates }
        cleaning: { kind: available, rule: cleanings.one_cleaning_at_a_time, label: No cleaning }
    stay_table:
      kind: table
      query: listings_for_guests
      title: Stays
      filters:
        city: { default: Lisbon }
        guests: { label: Guests }
      columns:
        title: { link: listing_detail }
        city: {}
        guests: { align: end }
        nightly_rate: { label: Price per night, align: end }
      pagination: { page_size: 2 }
      states:
        empty: { title: No stays, text: No listing has room for these guests. }
    month_cards:
      kind: cards
      query: bookings_by_month
      params: { year: $route.year }
      card:
        title: month
        fields: [bookings, nights]
      states:
        empty: { title: No bookings in this year }
    listing_calendar:
      kind: calendar
      query: bookings_of_listing
      params: { listing: $route.id }
      start: check_in
      end: check_out
      label: guest

seed:
  Listing:
    records:
      harbour_loft: { title: Harbour loft, city: Lisbon, guests: 2, nightly_rate: 95 }
      old_town_flat: { title: Old town flat, city: Lisbon, guests: 4, nightly_rate: 120 }
      river_house: { title: River house, city: Lisbon, guests: 6, nightly_rate: 180 }
      canal_room: { title: Canal room, city: Amsterdam, guests: 2, nightly_rate: 110 }
  Booking:
    records:
      ana: { guest: Ana, check_in: 2026-03-02, check_out: 2026-03-06, listing: harbour_loft }
      ben: { guest: Ben, check_in: 2026-03-10, check_out: 2026-03-12, listing: old_town_flat }
      chloe: { guest: Chloe, check_in: 2026-04-01, check_out: 2026-04-08, listing: river_house }
