# yaml-language-server: $schema=../../schema/app.schema.json
# Invoices: the small DSL additions of M33. An invoice gets the next
# number of a sequence (`sequence`), and a line gets the next position.
# The seed records get the numbers in their order. The amounts are in the
# currency of the customer (`currency_field`). The invoice feed and the
# line cards show the next page at their end (`pagination.mode: scroll`).
# The charts of the dashboard group the dates by day, week, and year
# (`interval`).
# scripts/check-nextjs.sh, scripts/check-react.sh, and
# scripts/check-fastapi.sh generate and check the apps of this
# definition, and scripts/sequence_test.py creates invoices in the
# Next.js app and in the mock store of the React app.
# The invoices keep a change log (ADR 0040), with the numbers.
version: 0

app:
  name: invoices
  title: Invoices
  description: Invoices of customers, with numbers in order.

entities:
  Customer:
    display_field: name
    crud: { views: [table], forms: [create] }
    fields:
      name: { type: string, required: true, max_length: 120 }
      currency: { type: enum, values: [usd, eur, gbp], default: usd }

  Invoice:
    display_field: number
    crud: { views: [table, detail], forms: [create, update] }
    history: true
    fields:
      number:
        type: string
        unique: true
        sequence: { start: 1001, prefix: INV-, width: 4 }
      issued_on: { type: date, required: true }
      paid_at: { type: datetime }
      total:
        type: decimal
        min: 0
        precision: 12
        scale: 2
        format: currency
        currency_field: customer.currency
    relations:
      customer: { kind: many_to_one, target: Customer, required: true }
      lines: { kind: one_to_many, target: Line, inverse: invoice }

  Line:
    display_field: text
    crud: { views: [table], forms: [create] }
    fields:
      position: { type: integer, sequence: {} }
      text: { type: string, required: true, max_length: 200 }
      amount:
        type: decimal
        min: 0
        precision: 12
        scale: 2
        format: currency
        currency_field: invoice.customer.currency
    relations:
      invoice: { kind: many_to_one, target: Invoice, required: true, inverse: lines }

seed:
  Customer:
    records:
      acme: { name: Acme Corporation }
      globex: { name: Globex, currency: eur }
  Invoice:
    records:
      first: { issued_on: 2026-01-15, paid_at: "2026-01-20T10:00:00Z", total: 1200, customer: acme }
      second: { issued_on: 2026-02-01, total: 80.5, customer: globex }
    mock: 4

ui:
  views:
    invoice_feed:
      kind: table
      entity: Invoice
      title: Invoice feed
      columns: { number: {}, issued_on: {}, total: {}, customer: {} }
      sort: { field: number, direction: desc }
      pagination: { mode: scroll, page_size: 4 }
    line_cards:
      kind: cards
      entity: Line
      title: Line cards
      card: { title: text, fields: [amount, position] }
      filters:
        search: { kind: search, fields: [text] }
      pagination: { mode: scroll, page_size: 5 }
  dashboards:
    overview:
      title: Overview
      widgets:
        euro_total:
          kind: stat
          label: Invoices in euros
          entity: Invoice
          aggregate: sum
          field: total
          filter: { customer.currency: eur }
        by_currency:
          kind: chart
          chart: bar
          label: Totals by currency
          entity: Invoice
          group_by: customer.currency
          aggregate: sum
          field: total
        by_day:
          kind: chart
          chart: bar
          label: Invoices by day
          entity: Invoice
          group_by: issued_on
          interval: day
        paid_by_week:
          kind: chart
          chart: line
          label: Payments by week
          entity: Invoice
          group_by: paid_at
          interval: week
        by_year:
          kind: chart
          chart: bar
          label: Invoices by year
          entity: Invoice
          group_by: issued_on
          interval: year

pages:
  overview: { path: /, title: Overview, content: { dashboard: overview } }
  customers: { path: /customers, title: Customers, content: { view: customer_table } }
  invoices: { path: /invoices, title: Invoices, content: { view: invoice_table } }
  invoice_detail:
    path: "/invoices/{id}"
    title: Invoice
    entity: Invoice
    content: { view: invoice_detail }
  lines: { path: /lines, title: Lines, content: { view: line_table } }
  invoice_feed: { path: /feed, title: Invoice feed, content: { view: invoice_feed } }
  line_cards: { path: /line-cards, title: Line cards, content: { view: line_cards } }
