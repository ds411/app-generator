# An API with a secret that the FastAPI app does not expose: the React
# app has no client for it, and marks it as a gap
# (tests/test_skill_fill_gaps.py).
version: 0
app: { name: budgets, title: Budgets }
entities:
  Budget:
    fields:
      amount: { type: decimal }
apis:
  exchange_rates:
    document: ../../examples/project-tracker/apis/exchange-rates.openapi.json
    base_url_env: EXCHANGE_RATES_API_URL
    security: { scheme: ApiKeyAuth, env: EXCHANGE_RATES_API_KEY }
    operations: [getLatestRates]
