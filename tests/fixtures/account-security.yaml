# An app with the account security of the sign-in: the verification of
# the email address of a new user (ADR 0023), the password reset, and the
# second factor (ADR 0024), which the role `admin` must use. The user
# name is not the email address, so the messages go to the field
# `email`. The messages are in the language of the request, and the
# delivery is the extension file of the app.
# scripts/check-fastapi.sh checks the FastAPI app of this definition.
version: 0
app:
  name: club-desk
  title: Club desk
entities:
  Member:
    fields:
      login: { type: string, required: true, unique: true, max_length: 60 }
      email: { type: email, required: true, unique: true }
      name: { type: string, required: true, max_length: 120 }
      role: { type: enum, values: [admin, member], required: true, default: member }
  Note:
    fields:
      text: { type: text, required: true }
operations:
  list_members: { kind: list, entity: Member }
  list_notes: { kind: list, entity: Note }
  create_note: { kind: create, entity: Note }
auth:
  user_entity: Member
  username_field: login
  sign_up:
    fields: [login, email, name]
    verify_email: { token_minutes: 120 }
  password_reset: {}
  second_factor:
    totp: true
    required_roles: [admin]
  providers:
    club:
      title: Club account
      issuer: https://login.example.com
      client_id_env: CLUB_CLIENT_ID
      client_secret_env: CLUB_CLIENT_SECRET
      username_claim: preferred_username
access:
  role_field: role
  roles:
    admin: { operations: ["*"] }
    member: { operations: [list_notes, create_note] }
translations:
  default: en
  languages:
    en: { label: English }
    de:
      label: Deutsch
      text:
        Reset the password: Das Passwort zurücksetzen
        Confirm the email address: Die E-Mail-Adresse bestätigen
