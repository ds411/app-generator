# yaml-language-server: $schema=../../schema/app.schema.json
# Places: the points of M35 (ADR 0046). A place has a point, and the
# list of the places has the filters `near` (a point and a distance) and
# `area` (a box of a map), also through the relation to its city. The map
# of the places shows a marker for each place, and lists the places in
# its visible area.
# scripts/check-fastapi.sh generates and checks the FastAPI app of this
# definition, and runs its tests on Postgres and SQLite.
# scripts/places_ui_test.py opens the map in the Next.js app, the React
# app, and the React app with the FastAPI app, with a local tile server.
version: 0

app:
  name: places
  title: Places
  description: Places to visit, and their cities.

entities:
  City:
    display_field: name
    crud: true
    fields:
      name: { type: string, required: true, max_length: 80 }
      center: { type: point, label: Center, description: The center of the city. }
    relations:
      places: { kind: one_to_many, target: Place, inverse: city }

  Place:
    display_field: name
    crud: { views: [table, detail], forms: [update] }
    fields:
      name: { type: string, required: true, max_length: 120 }
      kind: { type: enum, values: [museum, park, view], required: true }
      location: { type: point, required: true, label: Location }
      entrance: { type: point, default: { lat: 38.7139, lng: -9.1335 } }
    relations:
      city: { kind: many_to_one, target: City, inverse: places }
    history: true

pages:
  places: { path: /places, title: Places, content: { view: place_list } }
  place_map: { path: /map, title: Map, content: { view: place_map } }
  place_detail:
    path: "/places/{id}"
    title: Place
    entity: Place
    content: { view: place_detail }
  new_place: { path: /places/new, title: New place, content: { form: new_place } }

ui:
  views:
    place_list:
      kind: table
      entity: Place
      columns:
        name: {}
        kind: {}
        city: {}
      filters:
        nearby: { kind: near, field: location, label: Near, distance: 5 }
        visible: { kind: area, field: location, label: In the map }
        near_city: { kind: near, field: city.center, label: Near the city }
        kind: { kind: select, field: kind }
    place_map:
      kind: map
      entity: Place
      title: Map of the places
      point: location
      label: name
      link: place_detail
      sort: { field: name }
      filters:
        kind: { kind: select, field: kind }
        nearby: { kind: near, field: location, label: Near, distance: 10 }
  forms:
    new_place:
      entity: Place
      operation: create_place
      mode: page
      title: New place
      fields:
        name: {}
        kind: {}
        location: {}
        entrance: {}
        city: {}
      on_success: { toast: The place is saved., navigate: place_map }

seed:
  City:
    records:
      lisbon: { name: Lisbon, center: { lat: 38.7223, lng: -9.1393 } }
      porto: { name: Porto, center: "41.1579,-8.6291" }
  Place:
    records:
      tower:
        name: Belém Tower
        kind: view
        location: { lat: 38.6916, lng: -9.216 }
        city: lisbon
      monastery:
        name: Jerónimos Monastery
        kind: museum
        location: { lat: 38.6979, lng: -9.2068 }
        city: lisbon
      park:
        name: Eduardo VII Park
        kind: park
        location: { lat: 38.7287, lng: -9.1546 }
        city: lisbon
      gardens:
        name: Crystal Palace Gardens
        kind: park
        location: { lat: 41.148, lng: -8.6254 }
        city: porto
      serralves:
        name: Serralves Museum
        kind: museum
        location: { lat: 41.1595, lng: -8.6597 }
        city: porto
