[project]
name = "appgen"
version = "0.1.0"
description = "Generate application code from a declarative YAML app definition."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "pathspec>=1.1",
    "pydantic>=2.12",
    "pyyaml>=6.0.3",
    "typer>=0.27",
]

[project.scripts]
appgen = "appgen.cli:app"

[project.entry-points."appgen.bindings"]
minimal = "appgen.bindings.minimal:BINDING"
nextjs = "appgen.bindings.nextjs:BINDING"
fastapi = "appgen.bindings.fastapi:BINDING"
react = "appgen.bindings.react:BINDING"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pyright>=1.1.414",
    "pytest>=9.1",
    "ruff>=0.17",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# The golden files are the output of the bindings, with their own config.
# The hand-written code of the examples belongs to the generated apps,
# which lint it with their own settings.
extend-exclude = ["tests/golden", "examples/*/extensions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/golden"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["golden"]
addopts = ["--strict-markers", "--strict-config"]
