# Milestones for this repository. The "Planning sync" workflow creates or
# updates them on each push to main. It matches milestones by title.
# Write each description with .github/MILESTONE_TEMPLATE.md.

- title: "M0: Repository foundation"
  description: |
    **Goal:** The repo has a Python project, a pre-push hook for checks, and the workflow templates.

    **Scope**
    - In: GitHub workflow templates, CONTRIBUTING.md, the uv Python project, the pre-push hook, and the ADR folder.
    - Out: Generator code. CI on GitHub Actions (the pre-push hook replaces it, to save cost).

    **Exit criteria**
    - [ ] The pre-push hook runs lint, type checks, and tests, and stops a push with a failed check.
    - [ ] The README gives the setup, lint, and test commands.

    **Demo:** Push a branch with a failed test, and see the hook stop the push.

    **Depends on:** None.

- title: "M1: App definition DSL"
  description: |
    **Goal:** An app author can write and validate the data model of an app in YAML.

    **Scope**
    - In: the DSL v0 ADR, extensibility (a version field, a rule for unknown keys), a YAML loader with source positions, stable element IDs, validation, a JSON Schema, example definitions, and `appgen validate`.
    - Out: The UI part of the DSL (M2). Authentication, authorization, workflows, and translations.

    **Exit criteria**
    - [ ] `appgen validate` accepts the project tracker example.
    - [ ] Each validation error shows the file, the line, and the column.
    - [ ] Each definition element has a stable ID.

    **Demo:** `appgen validate` on the example and on a broken copy.

    **Depends on:** M0.

- title: "M2: UI DSL and design tokens"
  description: |
    **Goal:** An app author can describe a detailed UI and its design tokens in YAML.

    **Scope**
    - In: the UI DSL ADR, design tokens (color with light and dark modes, typography, spacing, radius, shadow, breakpoints), layouts and navigation, data views, forms, detail views and dashboards, UI states and responsive rules, validation of UI references, and the UI of the project tracker example.
    - Out: Code generation for the UI (M5 and M7).

    **Exit criteria**
    - [ ] `appgen validate` accepts the project tracker with its full UI.
    - [ ] Validation reports each reference to a missing token, field, operation, or route.

    **Demo:** `appgen validate` on the project tracker and on a copy with a missing token.

    **Depends on:** M1.

- title: "M3: Generator core"
  description: |
    **Goal:** The generator writes deterministic code with traces and generation gaps.

    **Scope**
    - In: the trace format ADR, the generation gap ADR, the binding contract, deterministic Jinja2 rendering, trace emission, generation gaps, design token resolution, the output manifest, and `appgen generate`.
    - Out: The real bindings (M5 to M7). The trace checker (M4).

    **Exit criteria**
    - [ ] Two runs of `appgen generate` give the same output, byte for byte.
    - [ ] Each generated file carries traces to the definition.
    - [ ] Regeneration keeps the hand-written extension files.

    **Demo:** `appgen generate` with the test binding, two times, and a diff that shows no change.

    **Depends on:** M2.

- title: "M4: Trace checker"
  description: |
    **Goal:** A maintainer can see what the code covers and which traces are wrong.

    **Scope**
    - In: the trace scanner, the coverage report, the invalid trace report, text and JSON output, exit codes, and `appgen check`.
    - Out: An IDE integration.

    **Exit criteria**
    - [ ] `appgen check` lists uncovered definition elements and open gaps.
    - [ ] `appgen check` lists malformed traces and traces to unknown elements.
    - [ ] The pre-push hook stops a push for invalid traces.

    **Demo:** `appgen check` on the test binding output, before and after a change to the definition.

    **Depends on:** M3.

- title: "M5: Next.js 16 binding"
  description: |
    **Goal:** The generator writes a full-stack Next.js app with a detailed UI.

    **Scope**
    - In: Next.js 16 App Router with TypeScript, FSD, shadcn/ui, the theme from design tokens, Drizzle and Postgres, server actions, layouts and navigation, data views, forms, detail views and dashboards, generation gaps, the Dockerfile and Docker Compose file, and the pre-push checks.
    - Out: Authentication.

    **Exit criteria**
    - [ ] The generated project tracker installs, type checks, lints, and builds with pnpm.
    - [ ] The app runs in Docker with Postgres, in light and dark mode.
    - [ ] The trace check reports no invalid traces.

    **Demo:** `docker compose up` for the generated project tracker.

    **Depends on:** M4.

- title: "M6: FastAPI binding"
  description: |
    **Goal:** The generator writes a standalone FastAPI REST API.

    **Scope**
    - In: FastAPI 0.161 on Python 3.14 with uv, vertical slices, Pydantic schemas, SQLAlchemy and Alembic with Postgres, endpoints, API tests, generation gaps, the Dockerfile and Docker Compose file, and the pre-push checks.
    - Out: Authentication. A UI.

    **Exit criteria**
    - [ ] The generated API passes its generated tests.
    - [ ] The API runs in Docker with Postgres.
    - [ ] The trace check reports no invalid traces.

    **Demo:** `docker compose up`, then open the OpenAPI docs of the generated API.

    **Depends on:** M4.

- title: "M7: React 19 binding"
  description: |
    **Goal:** The generator writes a standalone React app with a detailed UI and mock data.

    **Scope**
    - In: React 19 with TypeScript, Vite, React Router, FSD, shadcn/ui, the theme from design tokens, entity types and mock data, layouts and navigation, data views, forms, detail views and dashboards, generation gaps, the Dockerfile, and the pre-push checks.
    - Out: Calls to a real API.

    **Exit criteria**
    - [ ] The generated project tracker installs, type checks, lints, and builds with pnpm.
    - [ ] The app runs in Docker and shows the mock data, in light and dark mode.
    - [ ] The trace check reports no invalid traces.

    **Demo:** `docker run` for the generated project tracker.

    **Depends on:** M4.

- title: "M8: End-to-end proof of concept"
  description: |
    **Goal:** One definition drives all three apps, and the traces stay correct after a change.

    **Scope**
    - In: the generation of all three apps from one definition, end-to-end smoke tests, Playwright UI tests, a change scenario, the user docs, and the evaluation report.
    - Out: Production hardening.

    **Exit criteria**
    - [ ] The pre-push checks generate, build, and run all three apps.
    - [ ] The Playwright UI tests pass in light and dark mode.
    - [ ] After a change to the definition, the gap code stays and the checker reports the drift.
    - [ ] The evaluation report is complete.

    **Demo:** One run of the pre-push checks that generates, builds, tests, and checks all three apps.

    **Depends on:** M5, M6, and M7.

- title: "M9: Honest gap report"
  description: |
    **Goal:** The trace report shows all open work, and the stubs of the generated apps are safe to show.

    **Scope**
    - In: open gaps for stubs that generated code calls, stubs with written code, warnings for skipped trace text, a better "did you mean" hint, a list of orphaned extension files, a 501 status for the FastAPI stubs, and the element ID of a stub widget in development builds only.
    - Out: The logic of the stubs. Changes to the trace format.

    **Exit criteria**
    - [ ] `appgen check` reports the 8 stubs of each app as open gaps.
    - [ ] After the change scenario, the checker suggests the renamed element and lists the orphaned extension files.
    - [ ] A call to a FastAPI custom operation stub returns status 501.

    **Demo:** `appgen check` on the three generated apps, before and after the change scenario.

    **Depends on:** M8.

- title: "M10: Generated app fixes"
  description: |
    **Goal:** The generated apps fix the problems that the M8 evaluation found.

    **Scope**
    - In: seed data and a 404 page for Next.js, consistent mock data for React, the fixes of the app shell (breadcrumb, sidebar, task board, duplicate actions, detail headings), and schema changes after the first FastAPI migration.
    - Out: New DSL keys (M12). Sign-in and an API client for React (M13).

    **Exit criteria**
    - [ ] The Next.js smoke and UI tests see pages with data.
    - [ ] A detail page for an unknown ID returns status 404 in Next.js.
    - [ ] The Playwright UI tests check each fix of the app shell in the light and the dark mode.

    **Demo:** The pre-push checks of the three apps, and the screenshots of the UI tests.

    **Depends on:** M8.

- title: "M11: Fast and stable checks"
  description: |
    **Goal:** The checks are fast, stable, and work in a new sandbox session without manual steps.

    **Scope**
    - In: stable chart screenshots, visual comparison, the Chromium version, Docker and pnpm caches, parallel app checks, mirror images, the Node image with the proxy CA, the session start hook, the GitHub REST calls, and the uv TLS variable.
    - Out: CI on GitHub Actions (M13).

    **Exit criteria**
    - [ ] A layout change fails a UI test.
    - [ ] In a new session, the pre-push hook runs all checks without manual setup.
    - [ ] A second run of all checks takes less time than the first run.

    **Demo:** `APPGEN_CHECK_ALL=1 git push` in a new session, two times.

    **Depends on:** M8.

- title: "M12: DSL extensions"
  description: |
    **Goal:** An app author can control more of the UI and write shorter definitions.

    **Scope**
    - In: number formats, the place of actions, layout hints, responsive and motion hints, a CRUD shorthand, a clear error for YAML 1.1 booleans, schemas for `x-` keys, a second example definition, and optional keys for FastAPI routes and tables.
    - Out: The reserved sections `auth`, `access`, `workflows`, and `translations` (M13).

    **Exit criteria**
    - [ ] `appgen validate` accepts both example definitions.
    - [ ] The three bindings generate and check both examples.
    - [ ] The docs describe each new key.

    **Demo:** `appgen generate` and `appgen check` on the second example with each binding.

    **Depends on:** M10.

- title: "M13: Deferred work"
  description: |
    **Goal:** Keep the stories that the project defers until after the next increments.

    **Scope**
    - In: sign-in, roles, workflows, translations, production hardening, an API client for React, and CI. Each story has the `deferred` label.
    - Out: All work. Do not start a story in this milestone until a person moves it to an active milestone.

    **Exit criteria**
    - [ ] A person moved or closed each story.

    **Demo:** Not applicable.

    **Depends on:** M12.

- title: "M14: Backlog"
  description: |
    **Goal:** Keep the stories that wait for a decision of a person.

    **Scope**
    - In: CI on GitHub Actions and an MCP server for appgen. Each story has the `deferred` label.
    - Out: All work. Do not start a story in this milestone until a person moves it to an active milestone.

    **Exit criteria**
    - [ ] A person moved or closed each story.

    **Demo:** Not applicable.

    **Depends on:** None.

- title: "M15: Agent skills"
  description: |
    **Goal:** An AI agent can use appgen to write and change app definitions, generate apps, and fill generation gaps.

    **Scope**
    - In: an `appgen` agent skill with the CLI workflow, references for a new definition, a change to a definition, and generation gaps, tests that keep the skill in agreement with the CLI and the DSL, the `appgen skills` commands that install the skill for Claude Code (`.claude`) and for other agents (`.agents`) in a project, the home folder, or a system folder, and an evaluation with agent tasks.
    - Out: An MCP server (M14). Skills for the maintainers of appgen.

    **Exit criteria**
    - [ ] `appgen skills install` writes the skill to each target and scope, and a second run changes no file.
    - [ ] A test fails when the skill names a command, an option, a DSL section, or a diagnostic code that does not exist, or leaves out one that exists.
    - [ ] An agent with only the installed skill writes a new definition, generates an app, and fills a gap, and `appgen check` reports no invalid traces.

    **Demo:** `appgen skills install --scope user`, then an agent session that adds an entity to the room-booking example and fills one gap.

    **Depends on:** M13.

- title: "M16: Third-party APIs"
  description: |
    **Goal:** A generated app can call third-party APIs that OpenAPI documents describe.

    **Scope**
    - In: a DSL section that names the OpenAPI documents and the operations that the app uses, the validation of the documents, a typed client for each binding, the use of a client in the extension files of custom operations, an example with a third-party API, and a mock server for the checks.
    - Out: Views that show the data of a third-party operation without hand-written code. Calls to the real APIs in the checks. OAuth sign-in flows for the third-party APIs.

    **Exit criteria**
    - [ ] `appgen validate` reports an operation that the OpenAPI document does not have.
    - [ ] Each binding generates a typed client, and the check of each app calls the mock server through it.
    - [ ] The trace check covers the `apis` elements.

    **Demo:** `appgen generate` for the example with the third-party API, then a custom operation that calls the API through the mock server.

    **Depends on:** M13.

- title: "M17: Sign-in and permissions"
  description: |
    **Goal:** The sign-in and the permissions of the generated apps cover the usual needs of a real app.

    **Scope**
    - In: sign-up, password reset with a generation gap for the delivery of the message, sign-in with an external OpenID Connect provider, permissions on single records (owner rules), and menus that show only the pages of the role.
    - Out: Multi-factor sign-in. A rule language for conditions. A protection in the React app with mock data (ADR 0011).

    **Exit criteria**
    - [ ] A new user signs up, signs in, and resets the password in the FastAPI and the Next.js apps.
    - [ ] A user signs in through a mock OpenID Connect provider in the checks.
    - [ ] A member cannot read or change a record of another member, and the menus show only the pages of the role.

    **Demo:** The room-booking example: sign up as a member, book a room, and try to change the booking of another member.

    **Depends on:** M13.

- title: "M18: Large lists and production"
  description: |
    **Goal:** The React client of the FastAPI app loads only the records that a page shows, and the FastAPI app runs on more than one replica and more than one platform.

    **Scope**
    - In: filters, search, and sort on the server for the list endpoints of the FastAPI app, a React client that sends the query of a view to the API, a shared store for the rate limit, and deployment files for a serverless container service.
    - Out: Rate limits and deployment files for the Next.js app. A search engine.

    **Exit criteria**
    - [ ] With `x-react-data: api`, the React app loads one page of records for each list request.
    - [ ] Two replicas of the FastAPI app share one rate limit.
    - [ ] The check of the FastAPI app validates the deployment files of each target.

    **Demo:** The React app with the FastAPI app and more records than one page, and the requests in the network log of the browser.

    **Depends on:** M13.

- title: "M19: Full translations"
  description: |
    **Goal:** The apps show all text and all formats in the selected language, and the back ends use the translations.

    **Scope**
    - In: the fixed text of the components, the format of dates and numbers for each language, the messages of the FastAPI app in the language of the request, and the render of the selected language on the Next.js server.
    - Out: Languages from right to left. Translations of the data in the records.

    **Exit criteria**
    - [ ] With a second language, the UI tests find no text of the default language on the pages, the fixed text included.
    - [ ] Dates and numbers use the format of the selected language.
    - [ ] The FastAPI app gives its messages in the language of `Accept-Language`.
    - [ ] Next.js renders the selected language on the server, and the text does not change after the hydration.

    **Demo:** The project tracker in its second language, in the Next.js app and the React app.

    **Depends on:** M13.

- title: "M20: Correct gap count"
  description: |
    **Goal:** The summary of `appgen generate` counts all the gaps that a run creates, the stubs of the custom elements included.

    **Scope**
    - In: the count and the list of the gaps in the summary of `appgen generate`, and the skill and the docs that describe the summary.
    - Out: The report of `appgen check`, which already lists all open gaps. A JSON format for the summary.

    **Exit criteria**
    - [ ] After a first run of each binding, the elements under `Gaps created` are the open gaps of `appgen check`.
    - [ ] A second run gives `Gaps created: 0`.

    **Demo:** `appgen generate tests/fixtures/project-tracker.yaml -b fastapi -o out`, then `appgen check tests/fixtures/project-tracker.yaml out`.

    **Depends on:** M15.

- title: "M21: Custom seed data"
  description: |
    **Goal:** An app author gives the seed records of an app in the definition or in data files, and each generated app loads them.

    **Scope**
    - In: a top-level `seed` section with records for each entity, inline or from local YAML, JSON, or CSV files, the validation of the records against the fields, the relations, and the rules, the seed records in the React mock data and in the Next.js seed, a seed command for the FastAPI app, and a skill reference for seed data.
    - Out: Updates or deletes of records that exist (the seed only adds records). Values in more than one language (M28). Passwords in the definition: the seed users keep `SEED_PASSWORD`. Data files on a server (URLs).

    **Exit criteria**
    - [ ] `appgen validate` reports a seed record with a wrong value, a missing required field, or a reference to a record that does not exist, at the line of the record in the definition or in the data file.
    - [ ] The React mock data, the Next.js seed, and the seed command of the FastAPI app give the seed records of the definition, with the same IDs in the three apps.
    - [ ] The trace check covers each `seed` element.
    - [ ] With only the skill, an agent adds seed records from a CSV file, and `appgen check` reports no invalid traces.

    **Demo:** `appgen generate` for the seed data fixture with each binding, then the records of the definition in the React app, in the Next.js app after `pnpm db:seed`, and in the FastAPI app after `uv run python -m app.cli seed`.

    **Depends on:** None.

- title: "M22: Skill checks"
  description: |
    **Goal:** The tests of the skill find a wrong statement in the skill, not only a wrong name, and the evaluation of the skill gives results for more runs and for more than one model.

    **Scope**
    - In: checks of the JSON examples, the exit codes, and the defaults that the skill gives, checks of the YAML fragments of the DSL reference, a script that prepares and scores the agent tasks of the evaluation, and three runs of each task with two models, a task for seed data included.
    - Out: An MCP server (M14). Agent runs in the pre-push hook, because they cost money. A check of the prose of the skill by a model.

    **Exit criteria**
    - [ ] A test fails when a JSON example of the skill has a key that the command does not give, or leaves out a key that the command gives.
    - [ ] A test fails when the skill gives a wrong exit code or a wrong default of an option.
    - [ ] Each YAML fragment of `docs/dsl.md` is valid in a base definition, or has a marker with a reason.
    - [ ] `docs/evaluation-skills.md` gives the results of three runs of each task with two models.

    **Demo:** `uv run pytest tests/test_skill_cli.py tests/test_docs.py`, and `uv run scripts/evaluate_skill.py score <task> <folder>`.

    **Depends on:** M21 (the task for seed data).

- title: "M23: API views and clients"
  description: |
    **Goal:** A view shows the data of a third-party API without hand-written code, and the clients call more kinds of operations.

    **Scope**
    - In: views with the data of an API operation in Next.js and React, endpoints of the FastAPI app that call an API with a secret for the React app, form and multipart bodies, text and binary answers, cookie parameters, and the OAuth 2.0 client credentials flow.
    - Out: Forms that send data to an API (a custom operation does this). OAuth flows with a user (authorization code) for the third-party APIs. OpenAPI documents on a server. Calls to the real APIs in the checks.

    **Exit criteria**
    - [ ] A view of the project tracker shows the public holidays of the mock server in Next.js and in React, without hand-written code.
    - [ ] The React app with `x-react-data: api` calls an API with a secret through the FastAPI app, and `appgen generate` gives no gap and no warning for it.
    - [ ] The checks call an operation with a multipart body, an operation with a cookie parameter, and an operation with a client credentials token on the mock server.

    **Demo:** The project tracker with the view of the public holidays in Next.js and React, and the network log of the browser.

    **Depends on:** None.

- title: "M24: Account security"
  description: |
    **Goal:** The sign-in of the generated apps checks the email address of a new user, has a second factor, and sends its messages without hand-written code.

    **Scope**
    - In: the verification of the email address after a sign-up, a second factor with time-based one-time passwords (TOTP) and recovery codes, and the delivery of the messages of the sign-in by SMTP.
    - Out: Other second factors (passkeys, SMS). Mail services with an HTTP API: the delivery hook stays a generation gap for them. A protection in the React app with mock data: it has no server (ADR 0011).

    **Exit criteria**
    - [ ] A new user cannot sign in before the user opens the link of the verification message, in the FastAPI and the Next.js apps.
    - [ ] A user with a second factor signs in with the password and a TOTP code, in each app.
    - [ ] With the SMTP delivery, the checks receive the reset and the verification messages in a mock SMTP server, and `appgen check` reports no gap for the delivery.

    **Demo:** The room booking example: sign up, open the link of the message in the mock SMTP server, turn on the second factor, and sign in with a code.

    **Depends on:** None.

- title: "M25: Record rules"
  description: |
    **Goal:** The record rules of a role express the usual conditions of real apps: the values of fields, the members of a team, and the records in embedded relations.

    **Scope**
    - In: field conditions in the record rules, owners through a path of relations (for example the members of the team of a project), the rules in the embedded relations of the FastAPI app, and the same rules in the Next.js and the React apps.
    - Out: A general expression language for rules. Rules that compare two fields of a record. Row-level security of the database.

    **Exit criteria**
    - [ ] A role with a field condition sees and changes only the records that the condition allows, in each app.
    - [ ] A member sees only the records of the teams of the member, through a path of relations, in each app.
    - [ ] An embedded relation of the FastAPI app shows no record that the rules of the role hide.

    **Demo:** A member signs in, and sees only the records of the teams of the member, and only the records with the values of the condition.

    **Depends on:** None.

- title: "M26: Large lists everywhere"
  description: |
    **Goal:** The React app with the FastAPI app loads only the records that a page shows, also for the related records, the boards, the calendars, the forms, and the dashboards, and the FastAPI app can use the full-text search of Postgres.

    **Scope**
    - In: requests by ID for the related records, a server search for the options of the reference fields, boards and calendars that load by column and by date range, the values of the dashboards on the server, and a full-text search in the FastAPI app.
    - Out: A search engine (for example OpenSearch). The Next.js app: it reads the database on the server.

    **Exit criteria**
    - [ ] With more records than one page, the network log of the React app shows no request that loads all pages of an entity, on each page of the project tracker.
    - [ ] Each `stat` and `chart` widget of a dashboard gets its value with one request, and the value is the same as with mock data.
    - [ ] With `x-fastapi-search: fulltext`, the search finds a record by a word of a text field on Postgres, and the tests on SQLite pass with the default search.

    **Demo:** The React app with the FastAPI app and 500 tasks, and the network log of the browser.

    **Depends on:** None.

- title: "M27: Next.js production"
  description: |
    **Goal:** The Next.js app has the production settings of the FastAPI app: a rate limit and deployment files.

    **Scope**
    - In: a rate limit of the server actions and the route handlers, in memory or in Redis, a health route, and deployment files for Kubernetes and Knative (Cloud Run).
    - Out: A rate limit of the React app: it has no server, so the API or the gateway limits the requests. Other platforms.

    **Exit criteria**
    - [ ] The Next.js app gives status 429 after the limit, and two processes share the limit in Redis.
    - [ ] The check of the Next.js app validates the deployment files of each target against their schemas.

    **Demo:** `scripts/check-nextjs.sh` with Redis, and the files in `deploy/` of the generated app.

    **Depends on:** None.

- title: "M28: Record translations and right-to-left languages"
  description: |
    **Goal:** The front ends show languages from right to left, and the author can mark text fields whose values have a translation for each language.

    **Scope**
    - In: the direction of each language, the layout of the front ends from right to left, UI tests in a language from right to left, and text fields with values in each language in the three bindings.
    - Out: Static routes of the Next.js app with translations: the pages read the database and the cookie of each request (ADR 0010). Machine translation of the values. Values in more than one language in the seed records.

    **Exit criteria**
    - [ ] With a language from right to left, the pages of the React and the Next.js apps have `dir="rtl"`, and the UI tests compare the pages with approved screenshots in that language.
    - [ ] A translatable field shows the value of the selected language, or the value of the default language when the record has no translation, in each app.

    **Demo:** The project tracker in a test language from right to left, and the title of a task in two languages.

    **Depends on:** None.
